<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grocery Buddy - Grocery List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-green-700 text-white py-4 shadow-md">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">My Grocery Buddy</h1>
            <button class="bg-white text-green-700 px-4 py-2 rounded-lg font-semibold hover:bg-green-100">
                Logout
            </button>
        </div>
    </header>

    <!-- Add Item Form -->
    <section class="container mx-auto mt-8 px-6">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4 text-green-700">Add New Item</h2>
            <form id="addItemForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" placeholder="Item name" class="border rounded-lg p-2 w-full" required>
                <input type="number" placeholder="Quantity" min="1" class="border rounded-lg p-2 w-full" required>
                <select class="border rounded-lg p-2 w-full">
                    <option>Produce</option>
                    <option>Dairy</option>
                    <option>Meat</option>
                    <option>Bakery</option>
                    <option>Pantry</option>
                    <option>Frozen</option>
                    <option>Beverages</option>
                    <option>Snacks</option>
                    <option>Other</option>
                </select>
                <button type="submit" class="bg-green-700 text-white rounded-lg px-4 py-2 hover:bg-green-800">
                    Add Item
                </button>
            </form>
        </div>
    </section>

    <!-- Grocery List Display -->
    <section class="container mx-auto mt-10 px-6 space-y-8">

        <!-- Example Category -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-semibold text-green-700 mb-4">Produce (2 items)</h3>
            <ul class="space-y-3">
                <!-- Item 1 -->
                <li class="flex justify-between items-center border-b pb-2">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" class="h-5 w-5 text-green-700">
                        <span class="text-gray-800">Apples (x3)</span>
                    </div>
                    <div class="space-x-2">
                        <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-md text-sm">Edit</button>
                        <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md text-sm">Delete</button>
                    </div>
                </li>

                <!-- Item 2 (Completed example) -->
                <li class="flex justify-between items-center border-b pb-2">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" checked class="h-5 w-5 text-green-700">
                        <span class="line-through text-gray-400">Bananas (x2)</span>
                    </div>
                    <div class="space-x-2">
                        <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-md text-sm">Edit</button>
                        <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md text-sm">Delete</button>
                    </div>
                </li>
            </ul>
        </div>
    </section>

    <!-- Stats Footer -->
    <footer class="bg-green-700 text-white mt-10 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <p>Total Items: <span id="totalItems">5</span></p>
            <p>Completed: <span id="completedItems">2</span></p>
            <p>Remaining: <span id="remainingItems">3</span></p>
        </div>
    </footer>

</body>
</html>
